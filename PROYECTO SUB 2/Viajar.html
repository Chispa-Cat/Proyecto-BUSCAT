<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Iniciar Viaje - Transporte Público</title>
</head>
<body>
    <!-- Mantener el mismo header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="buscat.png" alt="Logo Transporte Público">
            </div>
            <nav>
                <ul>
                    <li><a href="Inicio.html">Inicio</a></li>
                    <li><a href="Viajar.html">Viajar</a></li>
                    <li><a href="Horarios.html">Horarios</a></li>
                    <li><a href="Rutas.html">Rutas</a></li>
                    <li><a href="Cuenta.html">Mi Cuenta</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="viaje-container">
            <!-- Aside para el mapa con Google Maps -->
            <aside class="map-container">
                <h2>Mapa</h2>
                <!-- Google Maps iframe -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24175.24490203876!2d-98.30831896409887!3d19.060269618752506!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cfc0ed3bf4d58f%3A0xd4dbbebcf8569157!2sPuebla%2C%20Pue.!5e0!3m2!1ses-419!2smx!4v1697055722029!5m2!1ses-419!2smx" 
                        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </aside>

            <!-- Formulario de viaje -->
            <section class="travel-form">
                <h2>Planifica tu Viaje</h2>
                <form id="travelForm">
                    <label for="startPoint">Punto de Partida:</label>
                    <input type="text" id="startPoint" placeholder="Ingresa el punto de partida" required>

                    <label for="destination">Destino:</label>
                    <input type="text" id="destination" placeholder="Ingresa tu destino" required>

                    <!-- Botón para cargar opciones -->
                    <button type="button" id="loadOptions">Cargar Opciones</button>

                    <!-- Contenedor para las opciones de viaje -->
                    <div id="travelOptions" class="options-container">
                        <!-- Aquí se mostrarán las primeras dos opciones -->
                    </div>

                    <!-- Botón para generar más opciones -->
                    <button type="button" id="moreOptions">Generar Más Opciones</button>
                </form>
            </section>
        </div>

        <!-- Botón para subir/bajar la página -->
        <button class="scroll-to-top" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></button>

    </main>

    <!-- Mantener el mismo footer -->
    <footer>
        <div class="footer-container">
            <div>
                <h5>Contacto</h5>
                <p>Email: soporte@transporteapp.com</p>
                <p>Teléfono: +52 55 1234 5678</p>
            </div>
            <div>
                <h5>Síguenos en redes sociales</h5>
            <div class="social-media">
                <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
            </div>
            </div>
            <div>
                <h5>Enlaces Útiles</h5>
                <ul>
                    <li><a href="#">Términos y Condiciones</a></li>
                    <li><a href="#">Política de Privacidad</a></li>
                </ul>
            </div>
        </div>
    </footer>
</body>
</html>

<script type="text/javascript">
    // Funcionalidad para cargar opciones de viaje
document.getElementById('loadOptions').addEventListener('click', function() {
    const travelOptions = document.getElementById('travelOptions');
    travelOptions.innerHTML = `
        <p>Opción 1: Ruta de A a B (20 min)</p>
        <p>Opción 2: Ruta de A a C (25 min)</p>
    `;
});

// Funcionalidad para generar más opciones
document.getElementById('moreOptions').addEventListener('click', function() {
    const travelOptions = document.getElementById('travelOptions');
    travelOptions.innerHTML += `
        <p>Opción 3: Ruta de A a D (30 min)</p>
        <p>Opción 4: Ruta de A a E (35 min)</p>
    `;
});

        $(document).ready(function(){
            $('.carousel').slick({
                autoplay: true,
                autoplaySpeed: 1700,
                dots: true,
            });
        });

        function toggleMenu() {
            const nav = document.querySelector('nav ul');
            nav.classList.toggle('show');
        }

        window.onscroll = function() {
            const button = document.querySelector('.scroll-to-top');
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                button.style.display = "block";
            } else {
                button.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
</script>

<style type="text/css">
/* General */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f9;
}

header {
    background-color: #4a3f7d; /* Morado */
    padding: 15px;
}

.header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header img {
    height: 50px;
}

nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
}

nav ul li {
    margin-left: 20px;
}

nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
}

nav ul li a:hover {
    color: #79b473; /* Verde */
}

main {
    padding: 20px 0;
    max-width: 1200px;
    margin: 0 auto;
}
    /* Grid para la página de viaje */
.viaje-container {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
    padding: 20px;
}

.map-container {
    background-color: #f4f4f9;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.map-image {
    width: 100%;
    border-radius: 8px;
}

.travel-form {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.travel-form h2 {
    color: #4a3f7d;
}

.travel-form label {
    display: block;
    margin-top: 10px;
    color: #333;
}

.travel-form input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.travel-form button {
    display: block;
    width: 100%;
    padding: 10px;
    margin-top: 20px;
    background-color: #4a3f7d;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.travel-form button:hover {
    background-color: #79b473;
}

.options-container {
    margin-top: 20px;
}

.scroll-to-top {
    display: none; /* Oculto inicialmente */
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #ccc; /* Gris clarito */
    color: #333; /* Gris oscuro */
    border: none;
    padding: 10px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    transition: background-color 0.3s, color 0.3s;
}

.scroll-to-top:hover {
    background-color: #bbb; /* Gris más oscuro */
    color: #000; /* Negro */
}

footer {
    background-color: #333;
    color: #fff;
    padding: 20px 0;
    text-align: center;
}

footer .social-media {
    margin-bottom: 15px;
}

footer .social-media a {
    color: #f4f4f4;
    margin: 0 10px;
    font-size: 24px;
    text-decoration: none;
    transition: color 0.3s;
}

footer .social-media a:hover {
    color: #79b473; 
}

.footer-container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
}

footer h5 {
    margin-bottom: 10px;
}

footer ul {
    list-style: none;
    padding: 0;
}

footer ul li {
    margin-bottom: 5px;
}

footer ul li a {
    color: #fff;
    text-decoration: none;
    transition: color 0.3s;
}

footer ul li a:hover {
    color: #79b473;
}

</style>
